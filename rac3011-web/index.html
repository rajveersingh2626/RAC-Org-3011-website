<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D81B60" />
    <title>Rotaract District Organization 3011 | Official Website</title>
    <!-- Preload Rotary Wheel Anchor Image for Instant 60FPS Initial Render -->
    <link rel="preload" as="image" href="/images.png" type="image/png" fetchpriority="high" />
    <!-- Google Fonts: Montserrat & Plus Jakarta Sans for unified typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Alex+Brush&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://api.rotaract3011.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.rotaract3011.org" />
    <!-- Leaflet & Mapbox styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      try {
        localStorage.setItem('rac3011.theme', 'light');
        document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
